<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misi Android Studio: Bangun Aplikasi Pertamamu</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1620;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;background:#12263A;color:#fff;display:flex;flex-direction:column}
#hd{height:64px;display:flex;align-items:center;gap:24px;padding:0 32px;background:#0b1620;font-size:20px}
#hd b{flex:1;font-size:22px}
#mn{flex:1;padding:20px 40px;overflow:hidden;position:relative}
#ft{height:76px;display:flex;justify-content:space-between;align-items:center;padding:0 40px;background:#0b1620;font-size:20px}
button{font:inherit;font-size:20px;cursor:pointer;min-height:48px;border-radius:10px;border:2px solid #5a7a98;background:#1c3a54;color:#fff;padding:8px 18px;text-align:left}
button:hover:not(:disabled){border-color:#F2B84B}
button:focus-visible,g:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.ok:disabled,button.bad:disabled{opacity:1}
.pri{background:#F2B84B;color:#12263A;border-color:#F2B84B;font-weight:700;text-align:center}
.ok{background:#1F7A52!important;border-color:#1F7A52!important;color:#fff!important}
.bad{background:#B3261E!important;border-color:#B3261E!important;color:#fff!important}
h1{font-size:56px;margin:0 0 8px}h2{font-size:30px;margin:0 0 8px}
p{font-size:22px;line-height:1.4;margin:0 0 10px;max-width:880px}
ul{font-size:21px;line-height:1.4;margin:0;padding-left:24px}li{margin-bottom:8px}
.card{background:#1c3a54;border-radius:14px;padding:18px 24px}
.row{display:flex;gap:28px}.col{flex:1;display:flex;flex-direction:column;gap:10px}
#fb{min-height:56px;font-size:21px;padding:12px 18px;border-radius:10px;background:#0b1620;margin-top:12px}
#fb.ok{background:#1F7A52!important}#fb.bad{background:#B3261E!important}
.slot{font-size:20px;padding:11px 0;border-bottom:1px solid #3d5c78}
.reg rect{fill:#284560;stroke:#8fb0cc;stroke-width:2;cursor:pointer}.reg text{fill:#fff;pointer-events:none;font-weight:700}
.reg.sel rect{fill:#F2B84B}.reg.sel text{fill:#12263A}.reg.ok rect{fill:#1F7A52;cursor:default}.reg.ok text{fill:#fff}
.ovl{position:absolute;inset:0;background:rgba(11,22,32,.93);display:flex;align-items:center;justify-content:center;text-align:center;z-index:5}
textarea{width:100%;height:80px;font:inherit;font-size:19px;border-radius:8px;border:2px solid #5a7a98;padding:8px;background:#fff;color:#12263A}
code{font-family:Consolas,monospace;background:#0b1620;padding:2px 8px;border-radius:6px;color:#F2B84B}
[draggable=true]{cursor:grab}
</style></head><body>
<div id="stage"><div id="hd"></div><div id="mn"></div><div id="ft"></div></div>
<script>
const E=id=>document.getElementById(id);
const Z=v=>Array(15).fill(v);const S={scr:'cover',done:Z(0),sc:Z(0),lv:Z(3),m:Z(null)};
let ac,mute=false;
const total=()=>S.sc.reduce((a,b)=>a+b,0);
function snd(ok){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=ok?'sine':'square';o.frequency.value=ok?660:200;g.gain.value=.07;o.start();o.stop(ac.currentTime+(ok?.15:.25))}catch(e){}}
function fb(t,c){const f=E('fb');if(f){f.textContent=t;f.className=c||''}}
function stopT(){const m=S.m[4];if(m&&m.iv){clearInterval(m.iv);m.iv=null}}
function lose(i){S.lv[i]--;snd(0);hud();if(S.lv[i]<=0){stopT();const d=document.createElement('div');d.className='ovl';d.innerHTML='<div class="card"><h2>Nyawa habis</h2><p>Tenang, setiap developer pernah gagal build. Baca petunjuk dengan teliti lalu coba lagi.</p><button class="pri" id="rt">Ulangi misi</button></div>';E('mn').appendChild(d);E('rt').onclick=()=>{S.lv[i]=3;S.sc[i]=0;S.done[i]=0;S.m[i]=null;go('m'+(i+1))}}}

/* ---------- data ---------- */
const P=[['Run','Menjalankan aplikasi ke emulator atau HP','run','Toolbar di bagian atas berisi tombol Run.'],
['Project','Menampilkan struktur folder dan file proyek','pr','Panel di kiri menampilkan folder dan file.'],
['Editor','Tempat menulis kode dan mengatur tampilan layout','ed','Bagian tengah adalah area kerja utama.'],
['Device Manager','Membuat dan mengelola perangkat virtual (emulator)','dm','Panel di kanan mengelola perangkat virtual.'],
['Logcat','Menampilkan log dan pesan error saat aplikasi berjalan','lg','Panel di bawah memuat pesan sistem.']];
const PERM=[3,0,4,2,1];
const ST=['Pilih New Project di layar Welcome','Pilih template Empty Activity','Isi nama aplikasi, package, bahasa, dan Minimum SDK','Klik Finish lalu tunggu Gradle sync selesai','Pilih emulator di Device Manager','Klik tombol Run'];
const EX=['Proyek baru selalu dimulai dari sini.','Template menentukan kerangka awal aplikasi.','Identitas aplikasi harus jelas sebelum dibuat.','Gradle menyusun proyek sebelum bisa dijalankan.','Aplikasi butuh perangkat tujuan untuk berjalan.','Terakhir, jalankan dan lihat hasilnya.'];
const SH=[3,0,5,2,4,1];
const Q=[{q:'Klien melapor: aplikasi langsung tertutup (crash) saat tombol Simpan ditekan. Apa langkah pertamamu?',o:['Buka Logcat, filter level Error, lalu cari baris pesan exception','Instal ulang Android Studio','Ganti emulator dengan yang lebih besar'],a:0,e:'Logcat mencatat penyebab crash, jadi baca dulu sebelum mengubah apa pun.'},
{q:'Logcat menunjuk error pada baris <code>findViewById(R.id.____)</code>. Di layout, ID tombolnya adalah <code>btn_simpan</code>. Isian yang benar?',o:['btnSimpan','btn_simpan','Simpan'],a:1,e:'ID harus sama persis dengan di layout, termasuk huruf dan garis bawah.'},
{q:'Setelah menambah library di build.gradle, Gradle sync gagal dan tab Build penuh warna merah. Tindakan yang tepat?',o:['Hapus seluruh folder proyek','Abaikan error dan langsung klik Run','Baca pesan di tab Build, perbaiki dependensi, lalu klik Sync Now'],a:2,e:'Pesan di tab Build menunjuk dependensi yang bermasalah. Perbaiki lalu sync ulang.'}];

const SL=['TextView','EditText','Button','ImageView'];
const D=[
{q:'Bagian mana yang dipakai untuk membaca pesan error saat aplikasi berjalan?',o:['Project','Editor','Logcat'],a:2,e:'Logcat menampilkan log dan pesan error.'},
{q:'Apa fungsi Device Manager?',o:['Mengelola perangkat virtual (emulator)','Menulis kode program','Membaca pesan error'],a:0,e:'Device Manager membuat dan mengelola emulator.'},
{q:'File mana yang memuat daftar Activity dan izin aplikasi?',o:['strings.xml','build.gradle','AndroidManifest.xml'],a:2,e:'Manifest menyimpan identitas, Activity, dan izin aplikasi.'},
{q:'Untuk apa Gradle sync dilakukan?',o:['Menghapus data emulator','Memuat ulang pengaturan build agar proyek sesuai','Mengganti versi Android di HP'],a:1,e:'Sync menyelaraskan proyek dengan pengaturan build.gradle.'},
{q:'Minimum SDK menentukan apa?',o:['Versi Android terlama yang bisa menjalankan aplikasi','Ukuran layar aplikasi','Bahasa pemrograman yang dipakai'],a:0,e:'Perangkat dengan Android lebih lama tidak bisa memasang aplikasi.'},
{q:'Di folder mana file layout tampilan layar disimpan?',o:['res/layout','manifests','Gradle Scripts'],a:0,e:'File XML tampilan layar berada di res/layout.'},
{q:'Level Logcat mana yang paling tepat untuk mencari penyebab crash?',o:['Verbose','Info','Error'],a:2,e:'Filter Error menyaring pesan kegagalan.'},
{q:'Package name aplikasi sebaiknya...',o:['Sama dengan aplikasi lain','Unik untuk tiap aplikasi','Dikosongkan'],a:1,e:'Package name adalah identitas unik aplikasi.'}];

/* ---------- navigasi ---------- */
function hud(){const mm=/^m\d+$/.test(S.scr),i=mm?+S.scr.slice(1)-1:-1;
E('hd').style.display=S.scr=='cover'?'none':'flex';
E('hd').innerHTML='<b>Misi Android Studio</b><span>'+(i>=0?'Energi: '+'♥'.repeat(S.lv[i])+'♡'.repeat(3-S.lv[i]):'')+'</span><span>Skor: '+total()+'</span><span>Selesai: '+S.done.filter(x=>x).length+'/15</span><button id="mt">'+(mute?'Suara mati':'Suara aktif')+'</button><button id="mu">Menu</button>';
E('mt').onclick=()=>{mute=!mute;hud()};E('mu').onclick=()=>go('menu')}
function nav(){const s=S.scr,i=/^m\d+$/.test(s)?+s.slice(1)-1:(s=='demo'?14:-1),all=S.done.every(x=>x),z=S.done.indexOf(0);
const pv=i>=0?'menu':{guide:'cover',menu:'guide',result:'menu',credit:'result'}[s];
let nx={cover:'guide',guide:'menu',menu:all?'result':(z<14?'m'+(z+1):'demo'),result:'credit'}[s],ok=s!='credit',lb=s=='cover'?'Mulai':'Berikutnya';
if(i>=0){ok=!!S.done[i];nx=i<13?'m'+(i+2):(i==13?'demo':(all?'result':'menu'));if(i==14)lb=all?'Lihat hasil':'Ke menu'}
const mid=i>=0?(i==14?'Demo ke klien':'Misi '+(i+1)+' dari 14'):({guide:'Panduan',menu:'Menu misi',result:'Evaluasi',credit:'Informasi kreator'}[s]||'');
E('ft').innerHTML='<button id="pv" '+(pv?'':'style="visibility:hidden"')+'>Kembali</button><span>'+mid+'</span><button class="pri" id="nx" '+(ok?'':'disabled')+'>'+lb+'</button>';
if(pv)E('pv').onclick=()=>go(pv);E('nx').onclick=()=>nx&&go(nx)}
function go(s){stopT();S.scr=s;R[s]();hud();nav()}

/* ---------- layar ---------- */
const R={
cover(){E('mn').innerHTML='<div class="row" style="height:100%;align-items:center"><div class="col" style="flex:1.3;gap:6px"><h1>Misi Android Studio</h1><h2 style="color:#F2B84B;font-size:38px">Bangun Aplikasi Pertamamu</h2><p>Studio Kodeku menerima proyek aplikasi kasir untuk koperasi sekolah. Selesaikan 15 tantangan sebagai developer junior: kenali alat kerjamu, rancang layar, hubungkan kode, dan bereskan bug sebelum tenggat!</p></div><svg viewBox="0 0 300 440" width="270" height="396" role="img" aria-label="Ilustrasi ponsel Android dengan kode"><rect x="20" y="10" width="260" height="420" rx="36" fill="#1c3a54" stroke="#F2B84B" stroke-width="5"/><rect x="40" y="50" width="220" height="340" rx="14" fill="#0b1620"/><circle cx="150" cy="130" r="44" fill="#1F7A52"/><rect x="60" y="210" width="130" height="14" rx="7" fill="#F2B84B"/><rect x="60" y="240" width="180" height="14" rx="7" fill="#8fb0cc"/><rect x="60" y="270" width="100" height="14" rx="7" fill="#8fb0cc"/><rect x="60" y="320" width="180" height="38" rx="10" fill="#F2B84B"/></svg></div>'},
guide(){E('mn').innerHTML='<h2>Panduan</h2><div class="row"><div class="card col"><h2 style="font-size:26px">Tujuan belajar</h2><ul><li>Mengenali bagian jendela Android Studio dan fungsinya.</li><li>Menyusun langkah membuat dan menjalankan proyek.</li><li>Merancang layar dan menghubungkannya dengan kode.</li><li>Menemukan penyebab masalah lewat Logcat dan Gradle.</li></ul></div><div class="card col"><h2 style="font-size:26px">Aturan main</h2><ul><li>Ada 15 tantangan: 14 misi dan satu demo ke klien. Tiap misi punya 3 energi.</li><li>Jawaban benar memberi +100 skor. Jawaban salah mengurangi 1 energi.</li><li>Misi 5 punya waktu bonus, jadi ambil keputusan dengan cepat dan tepat.</li><li>Pilih misi bebas lewat Menu. Tombol Berikutnya aktif setelah misi selesai.</li></ul></div></div><p style="margin-top:14px">Mentor Bina menemanimu di studio. Kamu berlatih mengambil keputusan, memecahkan masalah, dan mengatur waktu seperti developer sungguhan.</p>'},
menu(){const M=['Kenali Ruang Kerjamu','Mulai Proyek','Rancang Layar Kasir','Hubungkan Kode','Tiket Bug dari Klien','Peta File Proyek','Siklus Hidup Activity','Pilih Layout','Pindah Layar dengan Intent','Alur Hitung Total','Folder Resource','Uji Bug Gradle','Rilis Aplikasi','Ujian Keputusan','Demo ke Klien'];
E('mn').innerHTML='<h2>Menu tantangan</h2><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">'+M.map((m,i)=>'<div class="card col" style="gap:4px;padding:10px 14px"><b style="font-size:15px;color:#F2B84B">'+(i<14?'Misi '+(i+1):'Tantangan 15')+(S.done[i]?' ('+S.sc[i]+')':'')+'</b><div style="font-size:19px;font-weight:700;line-height:1.2;min-height:46px">'+m+'</div><button class="pri" data-a="g" data-v="'+(i<14?'m'+(i+1):'demo')+'" style="min-height:44px;padding:4px 10px">'+(S.done[i]?'Main lagi':'Mainkan')+'</button></div>').join('')+'</div>'},
m1(){const m=S.m[0]=S.m[0]||{sel:null,ok:[]};
const G=[['run',0,0,560,40],['pr',0,44,120,166],['ed',124,44,300,166],['dm',428,44,132,166],['lg',0,214,560,86]];
const svg=G.map(([k,x,y,w,h])=>'<g class="reg '+(m.ok.includes(k)?'ok':'')+' '+(m.sel==k?'sel':'')+'" data-a="k1" data-v="'+k+'" tabindex="0" role="button" aria-label="Bagian jendela"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8"/><text x="'+(x+w/2)+'" y="'+(y+h/2+7)+'" text-anchor="middle" font-size="'+(k=='dm'?15:20)+'">'+(m.ok.includes(k)?P.find(p=>p[2]==k)[0]:'?')+'</text></g>').join('');
E('mn').innerHTML='<h2>Misi 1: Kenali ruang kerjamu</h2><p>Klik satu bagian di jendela Android Studio, lalu pilih fungsinya.</p><div class="row"><svg viewBox="0 0 560 300" width="600" height="321" role="img" aria-label="Denah jendela Android Studio">'+svg+'</svg><div class="col" style="gap:8px">'+PERM.map(i=>{const d=m.ok.includes(P[i][2]);return '<button data-a="d1" data-v="'+i+'" class="'+(d?'ok':'')+'" '+(d?'disabled':'')+'>'+P[i][1]+'</button>'}).join('')+'</div></div><div id="fb">Pilih dulu salah satu bagian jendela.</div>'},
m2(){const m=S.m[1]=S.m[1]||{n:0};
E('mn').innerHTML='<h2>Misi 2: Susun langkah proyek pertama</h2><p>Klik langkah sesuai urutan yang benar, mulai dari yang paling awal.</p><div class="row"><div class="col" style="gap:8px">'+SH.map(i=>'<button data-a="s2" data-v="'+i+'" class="'+(i<m.n?'ok':'')+'" '+(i<m.n?'disabled':'')+'>'+ST[i]+'</button>').join('')+'</div><div class="card col" style="gap:0">'+ST.map((s,i)=>'<div class="slot">'+(i+1)+'. '+(i<m.n?s:'…')+'</div>').join('')+'</div></div><div id="fb">Langkah apa yang paling pertama dilakukan?</div>'},
m3(){const m=S.m[2]=S.m[2]||{ok:[],sel:null};
const T=['Judul layar: teks Kasir Koperasi','Kolom untuk mengetik harga barang','Tombol untuk menghitung total','Tempat gambar logo koperasi'];
const pv={TextView:'<b style="font-size:22px">Kasir Koperasi</b>',EditText:'<div style="border-bottom:2px solid #12263A;padding:4px 0;color:#5a6b7a">Harga barang</div>',Button:'<span style="background:#1F7A52;color:#fff;padding:6px 18px;border-radius:6px">Hitung</span>',ImageView:'<span style="background:#cfe0ee;display:inline-block;width:56px;height:40px;border-radius:6px;text-align:center;line-height:40px">Logo</span>'};
E('mn').innerHTML='<h2>Misi 3: Rancang layar kasir</h2><p>Seret komponen ke bagian layar yang cocok. Bisa juga klik komponen, lalu klik tempatnya.</p><div class="row"><div class="col" style="max-width:300px;gap:8px">'+SL.map(c=>'<button draggable="true" data-a="c3" data-v="'+c+'" class="'+(m.ok.includes(c)?'ok':(m.sel==c?'pri':''))+'" '+(m.ok.includes(c)?'disabled':'')+'>'+c+'</button>').join('')+'</div><div class="card" style="flex:1;background:#fff;color:#12263A;display:flex;flex-direction:column;gap:6px;padding:12px 18px">'+SL.map((s,i)=>'<div data-a="t3" data-v="'+i+'" tabindex="0" role="button" aria-label="'+T[i]+'" style="border:2px dashed '+(m.ok.includes(s)?'#1F7A52':'#5a7a98')+';border-radius:8px;padding:8px 12px;min-height:56px;cursor:pointer">'+(m.ok.includes(s)?pv[s]:'<span style="font-size:18px">'+T[i]+'</span>')+'</div>').join('')+'</div></div><div id="fb">Pilih satu komponen dulu.</div>'},
m4(){const m=S.m[3]=S.m[3]||{n:0};
const ans=['btn_hitung','setOnClickListener','edit_harga','toString'],W=['setOnClick','edit_harga','toString','btnHitung','setOnClickListener','toInt','btn_hitung','editHarga'];
const b=i=>'<span style="display:inline-block;min-width:150px;padding:0 8px;border-radius:6px;text-align:center;background:'+(i<m.n?'#1F7A52':(i==m.n?'#F2B84B':'#0b1620'))+';color:'+(i==m.n?'#12263A':'#fff')+';border:1px dashed #8fb0cc">'+(i<m.n?ans[i]:'____')+'</span>';
E('mn').innerHTML='<h2>Misi 4: Hubungkan kode</h2><p>Isi bagian kosong yang menyala kuning dengan kata yang tepat, dari atas ke bawah.</p><div class="card" style="font-family:Consolas,monospace;font-size:21px;line-height:2.1">val tombol = findViewById&lt;Button&gt;(R.id.'+b(0)+')<br>tombol.'+b(1)+' { hitungTotal() }<br>val harga = findViewById&lt;EditText&gt;(R.id.'+b(2)+').text.'+b(3)+'()</div><p style="margin-top:10px;font-size:19px">Di layout: ID tombol adalah <code>btn_hitung</code>, ID kolom harga adalah <code>edit_harga</code>.</p><div style="display:flex;flex-wrap:wrap;gap:8px">'+W.map(w=>'<button data-a="w4" data-v="'+w+'">'+w+'</button>').join('')+'</div><div id="fb">Pilih kata untuk bagian kosong pertama.</div>'},
m5(){const m=S.m[4]=S.m[4]||{q:0,t:90,w:0,iv:null};
if(!m.iv&&!S.done[4])m.iv=setInterval(()=>{if(m.t>0)m.t--;const x=E('tm');if(x)x.textContent=m.t},1000);
const c=Q[m.q];
E('mn').innerHTML='<h2>Misi 5: Tiket bug dari klien</h2><div style="display:flex;justify-content:space-between;font-size:22px;margin-bottom:8px"><span>Kasus '+(m.q+1)+' dari 3</span><span>Sisa waktu bonus: <b id="tm">'+m.t+'</b> detik</span></div><div class="card"><p style="margin:0">'+c.q+'</p></div><div class="col" style="margin-top:12px;gap:8px">'+c.o.map((o,i)=>'<button data-a="o5" data-v="'+i+'">'+o+'</button>').join('')+'</div><div id="fb">Pilih tindakan yang paling tepat.</div>'},
demo(){const m=S.m[14]=S.m[14]||{q:0,set:D.map((x,i)=>i).sort(()=>Math.random()-.5).slice(0,5)};
const c=D[m.set[m.q]];
E('mn').innerHTML='<h2>Demo ke klien</h2><div style="font-size:22px;margin-bottom:8px">Soal '+(m.q+1)+' dari 5</div><div class="card"><p style="margin:0">'+c.q+'</p></div><div class="col" style="margin-top:12px;gap:8px">'+c.o.map((o,i)=>'<button data-a="o6" data-v="'+i+'">'+o+'</button>').join('')+'</div><div id="fb">Pilih jawaban yang paling tepat.</div>'},
result(){const t=total(),p=Math.min(1,t/6300),n=p>=.85?3:p>=.6?2:1,L=['Calon developer, ayo coba lagi','Android Developer Junior','Android Developer Handal'][n-1];
